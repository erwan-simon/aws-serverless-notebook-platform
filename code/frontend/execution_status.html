<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execution Status</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { max-width: 500px; margin: 80px auto; padding: 0 20px; text-align: center; }
        .status { font-size: 18px; margin: 20px 0; }
        a.btn { display: inline-block; padding: 10px 24px; border-radius: 4px; text-decoration: none; font-size: 15px; margin: 8px; }
        .btn-view { background: #e3f2fd; color: #1565c0; }
        .btn-back { background: #eee; color: #333; }
        .success { color: #2e7d32; }
        .failed { color: #c62828; }
    </style>
</head>
<body>
    <h1>Notebook Execution</h1>
    <div id="pending">
        <div class="spinner"></div>
        <p class="status">Executing notebook...</p>
    </div>
    <div id="result" class="hidden">
        <p class="status" id="resultStatus"></p>
        <div id="resultActions"></div>
    </div>
    <div style="margin-top: 30px;">
        <a class="btn btn-back" href="index.html">Home</a>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        (async function () {
            await window._authReady;

            const params = new URLSearchParams(window.location.search);
            const executionId = params.get("execution_id");

            let polling = null;

            async function checkStatus() {
                const res = await fetch(CONFIG.apiBaseUrl + "/api/executions/" + encodeURIComponent(executionId) + "/status");
                const data = await res.json();

                if (data.status === "SUCCEEDED") {
                    clearInterval(polling);
                    document.getElementById("pending").classList.add("hidden");
                    document.getElementById("result").classList.remove("hidden");
                    document.getElementById("resultStatus").className = "status success";
                    document.getElementById("resultStatus").textContent = "Execution succeeded!";
                    document.getElementById("resultActions").innerHTML =
                        '<a class="btn btn-view" href="notebook.html?execution_id=' + encodeURIComponent(executionId) + '">View Output</a>';
                } else if (data.status === "FAILED" || data.status === "STOPPED") {
                    clearInterval(polling);
                    document.getElementById("pending").classList.add("hidden");
                    document.getElementById("result").classList.remove("hidden");
                    document.getElementById("resultStatus").className = "status failed";
                    const label = "Execution " + data.status.toLowerCase();
                    const logsUrl = data.status === "FAILED" ? ecsTaskLogsUrl(data.task_arn || "", executionId) : null;
                    document.getElementById("resultStatus").innerHTML = logsUrl
                        ? '<a href="' + logsUrl + '" target="_blank" style="color:inherit;">' + label + ' &mdash; view logs</a>'
                        : label;
                }
            }

            polling = setInterval(checkStatus, 5000);
            checkStatus();
        })();
    </script>
</body>
</html>
