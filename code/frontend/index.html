<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .nb-name-link { display: inline-block; color: #7b1fa2; text-decoration: none; font-weight: 600; font-size: 15px; padding: 5px 14px; border-radius: 6px; border: 1px solid #e0d4f5; background: #faf5ff; transition: all 0.15s; }
        .nb-name-link:hover { background: #f3e5f5; border-color: #ce93d8; color: #6a1b9a; }
        a.btn { display: inline-block; padding: 5px 14px; border-radius: 4px; text-decoration: none; font-size: 13px; }
        .nav-link { display: inline-block; padding: 6px 14px; border-radius: 6px; text-decoration: none; color: #7b1fa2; border: 1px solid #e0d4f5; background: #faf5ff; font-weight: 500; transition: all 0.15s; }
        .nav-link:hover { background: #f3e5f5; border-color: #ce93d8; color: #6a1b9a; }
        .btn-run { background: #e8f5e9; color: #2e7d32; }
        .actions-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        input[type="file"] { display: none; }
        .btn-upload { background: #fff; color: #444; border: 1px solid #ccc; cursor: pointer; transition: all 0.15s; padding: 7px 18px; font-weight: 500; letter-spacing: 0.01em; }
        .btn-upload:hover { background: #f5f5f5; border-color: #999; color: #222; }
        .upload-status { font-size: 13px; color: #666; }
        .session-bar { display: flex; align-items: center; gap: 12px; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px 20px; margin-bottom: 20px; background: #fafafa; flex-wrap: wrap; }
        .session-bar h2 { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; }
        .session-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .session-message { font-size: 12px; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .session-uptime { font-size: 12px; color: #888; white-space: nowrap; }
        .session-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
        .btn-stop { background: #ffebee; color: #c62828; cursor: pointer; border: none; font-size: 13px; padding: 5px 14px; border-radius: 4px; }
        .btn-open { background: #e8f5e9; color: #2e7d32; }
        .cron-cell { font-family: monospace; font-size: 12px; color: #555; white-space: nowrap; }
        .breadcrumb { display: flex; gap: 4px; align-items: center; margin-bottom: 12px; font-size: 14px; flex-wrap: wrap; }
        .breadcrumb a { color: #7b1fa2; text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb .sep { color: #999; }
        .folder-row { cursor: pointer; }
        .folder-row:hover { background: #f3e5f9; }
        .folder-icon { margin-right: 6px; }
        .menu-cell { position: relative; overflow: visible; text-align: right; }
        #nbTable th:last-child { width: 50px; }
        .menu-unsched { color: #880e4f; }
    </style>
</head>
<body>
    <div style="display:flex; align-items:center; justify-content:space-between;">
        <h1 style="flex:1;">Notebooks</h1>
        <nav style="display:flex; gap:8px; font-size:13px;">
            <a href="configurations.html" class="nav-link">Configurations</a>
        </nav>
    </div>
    <div class="session-bar" id="sessionCard">
        <h2>Session</h2>
        <div id="sessionStopped">
            <a class="btn btn-run" href="run.html">Launch Session</a>
        </div>
        <div id="sessionActive" style="display:none; contents;">
            <div class="session-info">
                <span id="sessionBadgeInline" class="status-badge"></span>
                <span id="sessionMessage" class="session-message"></span>
                <span id="sessionUptime" class="session-uptime"></span>
            </div>
            <div class="session-actions">
                <a class="btn btn-open" id="sessionBtn" href="#">Open Session</a>
                <a class="btn" href="session.html" style="background:#f3e5f5; color:#7b1fa2;">Details</a>
                <button class="btn-stop" id="sessionStop">Stop</button>
            </div>
        </div>
    </div>

    <div id="content"><p class="loading">Loading notebooks...</p></div>

    <dialog id="uploadDialog">
        <h3>Upload Notebook</h3>
        <label for="uploadName">Name</label>
        <input type="text" id="uploadName">
        <label>Labels <span style="font-weight:400; color:#999;">(optional)</span></label>
        <div id="uploadLabelsContainer"></div>
        <details style="margin-top: 14px; font-size: 13px;">
            <summary style="cursor: pointer; font-weight: 600; color: #555;">Default configuration <span style="font-weight: 400; color: #999;">(optional)</span></summary>
            <div style="margin-top: 10px;">
                <label for="uploadConfig">Configuration</label>
                <select id="uploadConfig"></select>
                <label for="uploadVcpu">vCPU</label>
                <select id="uploadVcpu"></select>
                <label for="uploadMemory">Memory</label>
                <select id="uploadMemory"></select>
            </div>
        </details>
        <details style="margin-top: 8px; font-size: 13px;">
            <summary style="cursor: pointer; font-weight: 600; color: #555;">Schedule <span style="font-weight: 400; color: #999;">(optional)</span></summary>
            <div style="margin-top: 10px;">
                <label for="uploadSchedCron">Cron Expression <a href="https://docs.aws.amazon.com/scheduler/latest/UserGuide/schedule-types.html" target="_blank" style="font-weight:400; font-size:12px; color:#1565c0; text-decoration:none;">syntax reference &#8599;</a></label>
                <input type="text" id="uploadSchedCron" placeholder="cron(0 9 * * ? *)">
                <label for="uploadSchedTimezone">Timezone</label>
                <select id="uploadSchedTimezone"></select>
                <label for="uploadSchedConfig">Configuration</label>
                <select id="uploadSchedConfig"></select>
                <label for="uploadSchedVcpu">vCPU</label>
                <select id="uploadSchedVcpu"></select>
                <label for="uploadSchedMemory">Memory</label>
                <select id="uploadSchedMemory"></select>
            </div>
        </details>
        <div style="margin-top: 18px;">
            <button class="btn-submit" id="uploadSubmit">Upload</button>
            <button class="btn-cancel" id="uploadCancel">Cancel</button>
        </div>
    </dialog>

    <dialog id="runDialog">
        <h3>Run Notebook</h3>
        <label for="dialogConfig">Configuration</label>
        <select id="dialogConfig"></select>
        <label for="dialogVcpu">vCPU</label>
        <select id="dialogVcpu"></select>
        <label for="dialogMemory">Memory</label>
        <select id="dialogMemory"></select>
        <div style="margin-top: 18px;">
            <button class="btn-submit" id="dialogSubmit">Run</button>
            <button class="btn-cancel" id="dialogCancel">Cancel</button>
        </div>
    </dialog>

    <dialog id="editNotebookDialog">
        <h3>Edit Notebook</h3>
        <input type="hidden" id="editNbId">
        <label>Labels</label>
        <div id="editNbLabelsContainer"></div>
        <details style="margin-top: 14px; font-size: 13px;">
            <summary style="cursor: pointer; font-weight: 600; color: #555;">Schedule</summary>
            <div style="margin-top: 10px;">
                <label for="editNbCron">Cron Expression <a href="https://docs.aws.amazon.com/scheduler/latest/UserGuide/schedule-types.html" target="_blank" style="font-weight:400; font-size:12px; color:#1565c0; text-decoration:none;">syntax reference &#8599;</a></label>
                <input type="text" id="editNbCron" placeholder="cron(0 9 * * ? *)">
                <label for="editNbTimezone">Timezone</label>
                <select id="editNbTimezone"></select>
                <label for="editNbSchedConfig">Configuration</label>
                <select id="editNbSchedConfig"></select>
                <label for="editNbSchedVcpu">vCPU</label>
                <select id="editNbSchedVcpu"></select>
                <label for="editNbSchedMemory">Memory</label>
                <select id="editNbSchedMemory"></select>
                <div style="margin-top: 10px;">
                    <button type="button" class="btn-delete" id="editNbUnschedule" style="display:none;">Remove schedule</button>
                </div>
            </div>
        </details>
        <div style="margin-top: 18px;">
            <button class="btn-submit" id="editNbSubmit">Save</button>
            <button class="btn-cancel" id="editNbCancel">Cancel</button>
        </div>
    </dialog>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        (async function () {
            await window._authReady;

            // Session card
            const sessionBtn = document.getElementById("sessionBtn");
            const sessionStop = document.getElementById("sessionStop");
            const sessionStopped = document.getElementById("sessionStopped");
            const sessionActive = document.getElementById("sessionActive");
            let sessionServiceName = null;
            let uptimeInterval = null;

            function showSessionCard(session) {
                sessionStopped.style.display = "none";
                sessionActive.style.display = "contents";

                const badge = document.getElementById("sessionBadgeInline");
                badge.style.display = "inline-block";
                badge.textContent = session.status.charAt(0).toUpperCase() + session.status.slice(1);
                badge.className = "status-badge status-" + session.status;
                document.getElementById("sessionMessage").textContent = session.message || "";

                if (session.started_at) {
                    document.getElementById("sessionUptime").textContent = "Up " + uptimeStr(session.started_at);
                    clearInterval(uptimeInterval);
                    uptimeInterval = setInterval(() => {
                        document.getElementById("sessionUptime").textContent = "Up " + uptimeStr(session.started_at);
                    }, 30000);
                } else {
                    document.getElementById("sessionUptime").textContent = "";
                }

                if (session.status === "running") {
                    sessionBtn.href = session.url;
                    sessionBtn.target = "_blank";
                    sessionBtn.textContent = "Open Session";
                } else {
                    sessionBtn.href = "status.html";
                    sessionBtn.textContent = "View Session";
                }

                sessionServiceName = session.service_name;
            }

            const sessionRes = await fetch(CONFIG.apiBaseUrl + "/api/sessions/me");
            if (sessionRes.ok) {
                const session = await sessionRes.json();
                if (session.status !== "stopped") {
                    showSessionCard(session);
                }
            }

            sessionStop.addEventListener("click", async () => {
                if (!sessionServiceName) return;
                if (!confirm("Stop your session?")) return;
                sessionStop.disabled = true;
                sessionStop.textContent = "Stopping...";
                const stopRes = await fetch(CONFIG.apiBaseUrl + "/api/sessions/" + encodeURIComponent(sessionServiceName), { method: "DELETE" });
                if (stopRes.ok) {
                    window.location.reload();
                } else {
                    alert("Stop failed");
                    sessionStop.disabled = false;
                    sessionStop.textContent = "Stop session";
                }
            });

            // Current folder from URL
            const urlParams = new URLSearchParams(window.location.search);
            const currentPath = urlParams.get("path") || "";

            const res = await fetch(CONFIG.apiBaseUrl + "/api/notebooks");
            const content = document.getElementById("content");

            if (!res.ok) {
                const err = await res.text();
                content.innerHTML = "<p style='color:red'>Error " + res.status + ": " + err + "</p>";
                return;
            }

            const notebooks = await res.json();

            if (!Array.isArray(notebooks)) {
                content.innerHTML = "<p>No notebooks found.</p>";
                return;
            }

            // Build breadcrumb
            function buildBreadcrumb(path) {
                let html = '<div class="breadcrumb">';
                if (!path) {
                    html += '<strong>Root</strong>';
                } else {
                    html += '<a href="index.html">Root</a>';
                    const parts = path.replace(/\/$/, "").split("/");
                    for (let i = 0; i < parts.length; i++) {
                        html += '<span class="sep">/</span>';
                        const subPath = parts.slice(0, i + 1).join("/") + "/";
                        if (i === parts.length - 1) {
                            html += "<strong>" + parts[i] + "</strong>";
                        } else {
                            html += '<a href="index.html?path=' + encodeURIComponent(subPath) + '">' + parts[i] + "</a>";
                        }
                    }
                }
                html += "</div>";
                return html;
            }

            // Split notebooks into folders and files at current path
            function getDirectoryContents(allNotebooks, path) {
                const folders = new Set();
                const files = [];
                for (const nb of allNotebooks) {
                    const name = nb.name || "";
                    if (!name.startsWith(path)) continue;
                    const rest = name.slice(path.length);
                    const slashIdx = rest.indexOf("/");
                    if (slashIdx !== -1) {
                        folders.add(rest.slice(0, slashIdx));
                    } else {
                        files.push(nb);
                    }
                }
                return { folders: [...folders].sort(), files };
            }

            const { folders, files } = getDirectoryContents(notebooks, currentPath);

            // Collect unique values for filters (from files in current dir only)
            const owners = [...new Set(files.map(nb => nb.owner || "").filter(Boolean))].sort();
            const statuses = [...new Set(files.map(nb => nb.last_execution_status || "").filter(Boolean))].sort();

            // Collect unique labels across all files
            const allFileLabels = [...new Set(files.flatMap(nb => nb.labels || []))].sort();

            let filtersHtml = '<div class="filters-bar">';
            filtersHtml += '<select id="filterOwner"><option value="">All owners</option>';
            for (const o of owners) filtersHtml += '<option value="' + o + '">' + o + '</option>';
            filtersHtml += '</select>';
            filtersHtml += '<select id="filterStatus"><option value="">All statuses</option>';
            for (const s of statuses) filtersHtml += '<option value="' + s + '">' + s + '</option>';
            filtersHtml += '</select>';
            filtersHtml += '<select id="filterScheduled"><option value="">All</option><option value="yes">Scheduled</option><option value="no">Not scheduled</option></select>';
            filtersHtml += '<select id="filterLabel"><option value="">All labels</option>';
            for (const l of allFileLabels) filtersHtml += '<option value="' + l + '">' + l + '</option>';
            filtersHtml += '</select>';
            filtersHtml += '<label class="btn btn-upload" id="uploadLabel" style="margin-left:auto;">&#x2795; Add Notebook<input type="file" id="fileInput" accept=".ipynb"></label>';
            filtersHtml += '<span class="upload-status" id="uploadStatus"></span>';
            filtersHtml += '</div>';

            function renderTable(folderList, fileList) {
                let html = "<table><thead><tr><th>Name</th><th>Labels</th><th>Owner</th><th>Uploaded</th><th>Last Execution</th><th>Last Status</th><th>Schedule</th><th></th></tr></thead><tbody>";
                for (const folder of folderList) {
                    const folderPath = currentPath + folder + "/";
                    html += '<tr class="folder-row" data-path="' + folderPath + '">';
                    html += '<td colspan="8"><span class="folder-icon">&#x1F4C1;</span>' + folder + '</td>';
                    html += "</tr>";
                }
                for (const nb of fileList) {
                    const id = encodeURIComponent(nb.id);
                    const displayName = nb.name.slice(currentPath.length);
                    const date = new Date(nb.uploaded_at).toLocaleString();
                    const lastExec = nb.last_execution_date ? new Date(nb.last_execution_date).toLocaleString() : "";
                    const lastStatus = nb.last_execution_status || "";
                    const labelsHtml = (nb.labels || []).slice().sort((a, b) => a.localeCompare(b)).map(function (l) { return '<span class="label-tag" title="' + l + '">' + l + '</span>'; }).join(" ");
                    html += "<tr>";
                    html += '<td title="' + displayName + '"><a class="nb-name-link" href="notebook.html?id=' + id + '">' + displayName + '</a></td>';
                    html += "<td>" + labelsHtml + "</td>";
                    html += '<td title="' + (nb.owner || "") + '">' + (nb.owner || "") + "</td>";
                    html += "<td>" + date + "</td>";
                    html += "<td>" + lastExec + "</td>";
                    html += "<td>" + (lastStatus ? '<span class="status-badge status-' + lastStatus.toLowerCase() + '">' + lastStatus + '</span>' : '') + "</td>";
                    const cronDisplay = nb.schedule_cron ? (nb.schedule_cron + (nb.schedule_timezone ? ' <span style="color:#888;">(' + nb.schedule_timezone + ')</span>' : '')) : "";
                    const cronTitle = nb.schedule_cron ? (nb.schedule_cron + (nb.schedule_timezone ? ' (' + nb.schedule_timezone + ')' : '')) : "";
                    html += '<td class="cron-cell" title="' + cronTitle + '">' + cronDisplay + "</td>";
                    html += '<td class="menu-cell">';
                    html += '<button class="menu-toggle">&#x22EE;</button>';
                    html += '<div class="menu-dropdown">';
                    html += '<a href="notebook.html?id=' + id + '">View</a>';
                    html += '<button class="btn-exec" data-id="' + id + '">Run</button>';
                    html += '<button class="btn-edit-nb" data-id="' + id + '" data-labels=\'' + JSON.stringify(nb.labels || []).replace(/'/g, "&#39;") + '\' data-cron="' + (nb.schedule_cron || "").replace(/"/g, "&quot;") + '" data-tz="' + (nb.schedule_timezone || "").replace(/"/g, "&quot;") + '">Edit</button>';
                    html += '<a href="executions.html?notebook_id=' + id + '">Executions</a>';
                    html += '<button class="danger btn-delete" data-id="' + id + '">Delete</button>';
                    html += "</div></td>";
                    html += "</tr>";
                }
                if (folderList.length === 0 && fileList.length === 0) {
                    html += '<tr><td colspan="8" style="color:#999;font-style:italic;">Empty folder</td></tr>';
                }
                html += "</tbody></table>";
                return html;
            }

            function applyFilters() {
                const ownerVal = document.getElementById("filterOwner").value;
                const statusVal = document.getElementById("filterStatus").value;
                const schedVal = document.getElementById("filterScheduled").value;
                const labelVal = document.getElementById("filterLabel").value;
                const filtered = files.filter(nb => {
                    if (ownerVal && (nb.owner || "") !== ownerVal) return false;
                    if (statusVal && (nb.last_execution_status || "") !== statusVal) return false;
                    if (schedVal === "yes" && !nb.schedule_cron) return false;
                    if (schedVal === "no" && nb.schedule_cron) return false;
                    if (labelVal && !(nb.labels || []).includes(labelVal)) return false;
                    return true;
                });
                document.getElementById("nbTable").innerHTML = renderTable(folders, filtered);
            }

            content.innerHTML = buildBreadcrumb(currentPath) + filtersHtml + '<div id="nbTable">' + renderTable(folders, files) + '</div>';

            // Upload handlers (elements now in DOM via filtersHtml)
            let uploadFileData = null;
            const uploadDialog = document.getElementById("uploadDialog");
            const uploadName = document.getElementById("uploadName");

            const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            function populateTimezoneSelect(selectEl, existingTz) {
                const options = [browserTz];
                if ("UTC" !== browserTz) options.push("UTC");
                if (existingTz && options.indexOf(existingTz) === -1) options.push(existingTz);
                selectEl.innerHTML = options.map(tz => '<option value="' + tz + '">' + tz + '</option>').join("");
                selectEl.value = existingTz || browserTz;
            }

            document.getElementById("fileInput").addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.name.endsWith(".ipynb")) {
                    document.getElementById("uploadStatus").textContent = "Error: file must be .ipynb";
                    return;
                }

                const reader = new FileReader();
                reader.onload = function () {
                    uploadFileData = btoa(new Uint8Array(reader.result).reduce((s, b) => s + String.fromCharCode(b), ""));
                    uploadName.value = currentPath + file.name;
                    populateTimezoneSelect(document.getElementById("uploadSchedTimezone"), "");
                    uploadDialog.showModal();
                };
                reader.readAsArrayBuffer(file);
            });

            // Load labels for autocomplete
            const allLabels = await loadAllLabels();
            const uploadLabelsInput = createLabelsInput(document.getElementById("uploadLabelsContainer"), allLabels);

            // Populate upload config selects
            const uploadConfig = document.getElementById("uploadConfig");
            const uploadVcpu = document.getElementById("uploadVcpu");
            const uploadMemory = document.getElementById("uploadMemory");
            async function loadConfigWithDefault(selectEl) {
                await loadConfigurationOptions(selectEl);
                const placeholder = document.createElement("option");
                placeholder.value = "";
                placeholder.textContent = "Use global default";
                selectEl.insertBefore(placeholder, selectEl.firstChild);
                selectEl.value = "";
            }
            await loadConfigWithDefault(uploadConfig);
            populateVcpuSelect(uploadVcpu, uploadMemory);
            uploadVcpu.addEventListener("change", () => populateMemorySelect(uploadVcpu, uploadMemory));

            // Upload schedule config selects
            const uploadSchedConfig = document.getElementById("uploadSchedConfig");
            const uploadSchedVcpu = document.getElementById("uploadSchedVcpu");
            const uploadSchedMemory = document.getElementById("uploadSchedMemory");
            await loadConfigurationOptions(uploadSchedConfig, null, "notebook");
            wireConfigSelects(uploadSchedConfig, uploadSchedVcpu, uploadSchedMemory);

            document.getElementById("uploadCancel").addEventListener("click", () => {
                uploadDialog.close();
                document.getElementById("fileInput").value = "";
            });

            document.getElementById("uploadSubmit").addEventListener("click", async () => {
                const btn = document.getElementById("uploadSubmit");
                btn.disabled = true;
                btn.textContent = "Uploading...";
                const uploadBody = {
                    filename: uploadName.value,
                    content: uploadFileData,
                    ...(uploadConfig.value ? { default_iam_role_arn: getSelectedConfig(uploadConfig).iam_role_arn, default_ecr_image_uri: getSelectedConfig(uploadConfig).ecr_image_uri } : {}),
                    default_vcpu: uploadVcpu.value ? parseInt(uploadVcpu.value) : undefined,
                    default_memory: uploadMemory.value ? parseInt(uploadMemory.value) : undefined,
                };
                const uLabels = uploadLabelsInput.getLabels();
                if (uLabels.length) uploadBody.labels = uLabels;
                const uCron = document.getElementById("uploadSchedCron").value.trim();
                if (uCron) {
                    const sCfg = getSelectedConfig(uploadSchedConfig);
                    uploadBody.schedule_cron = uCron;
                    uploadBody.schedule_timezone = document.getElementById("uploadSchedTimezone").value;
                    uploadBody.schedule_iam_role_arn = sCfg.iam_role_arn;
                    uploadBody.schedule_ecr_image_uri = sCfg.ecr_image_uri;
                    uploadBody.schedule_vcpu = parseInt(uploadSchedVcpu.value);
                    uploadBody.schedule_memory = parseInt(uploadSchedMemory.value);
                }
                const uploadRes = await fetch(CONFIG.apiBaseUrl + "/api/notebooks", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(uploadBody),
                });
                if (uploadRes.ok) {
                    uploadDialog.close();
                    window.location.reload();
                } else {
                    const err = await uploadRes.json().catch(() => ({}));
                    alert("Upload failed: " + (err.error || uploadRes.status));
                    btn.disabled = false;
                    btn.textContent = "Upload";
                }
            });

            // Folder click navigation
            content.addEventListener("click", (e) => {
                const row = e.target.closest(".folder-row");
                if (!row) return;
                window.location.href = "index.html?path=" + encodeURIComponent(row.dataset.path);
            });

            document.getElementById("filterOwner").addEventListener("change", applyFilters);
            document.getElementById("filterStatus").addEventListener("change", applyFilters);
            document.getElementById("filterScheduled").addEventListener("change", applyFilters);
            document.getElementById("filterLabel").addEventListener("change", applyFilters);

            // Menu toggle
            initMenuToggle(content);

            // Delete handler
            content.addEventListener("click", async (e) => {
                if (!e.target.classList.contains("btn-delete")) return;
                if (!confirm("Delete this notebook?")) return;
                const nbId = e.target.dataset.id;
                e.target.disabled = true;
                e.target.textContent = "Deleting...";
                const delRes = await fetch(CONFIG.apiBaseUrl + "/api/notebooks/" + encodeURIComponent(nbId), { method: "DELETE" });
                if (delRes.ok) {
                    window.location.reload();
                } else {
                    const err = await delRes.json().catch(() => ({}));
                    alert("Delete failed: " + (err.error || delRes.status));
                    e.target.disabled = false;
                    e.target.textContent = "Delete";
                }
            });

            // Run dialog
            const dialog = document.getElementById("runDialog");
            const dialogConfig = document.getElementById("dialogConfig");
            const dialogVcpu = document.getElementById("dialogVcpu");
            const dialogMemory = document.getElementById("dialogMemory");
            let runNotebookId = null;

            await loadConfigurationOptions(dialogConfig, null, "notebook");
            wireConfigSelects(dialogConfig, dialogVcpu, dialogMemory);

            // Build notebook lookup for defaults
            const notebookMap = {};
            for (const nb of files) { notebookMap[nb.id] = nb; }

            content.addEventListener("click", (e) => {
                if (!e.target.classList.contains("btn-exec")) return;
                runNotebookId = e.target.dataset.id;
                // Reset to global defaults first
                dialogConfig.selectedIndex = 0;
                const cfg = getSelectedConfig(dialogConfig);
                populateVcpuSelect(dialogVcpu, dialogMemory, cfg.vcpu, cfg.memory);
                // Apply notebook defaults if any
                const nb = notebookMap[decodeURIComponent(runNotebookId)];
                if (nb) applyNotebookDefaults(nb, dialogConfig, dialogVcpu, dialogMemory);
                dialog.showModal();
            });

            document.getElementById("dialogCancel").addEventListener("click", () => dialog.close());

            document.getElementById("dialogSubmit").addEventListener("click", async () => {
                const btn = document.getElementById("dialogSubmit");
                btn.disabled = true;
                btn.textContent = "Starting...";
                const execRes = await fetch(CONFIG.apiBaseUrl + "/api/executions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        notebook_id: runNotebookId,
                        ...getSelectedConfig(dialogConfig),
                        vcpu: parseInt(dialogVcpu.value),
                        memory: parseInt(dialogMemory.value),
                    }),
                });
                if (execRes.ok) {
                    const data = await execRes.json();
                    dialog.close();
                    window.location.href = "executions.html?notebook_id=" + encodeURIComponent(runNotebookId);
                } else {
                    const err = await execRes.json().catch(() => ({}));
                    alert("Run failed: " + (err.error || execRes.status));
                    btn.disabled = false;
                    btn.textContent = "Run";
                }
            });
            // Edit notebook dialog (labels + schedule)
            const editNbDialog = document.getElementById("editNotebookDialog");
            const editNbLabelsInput = createLabelsInput(document.getElementById("editNbLabelsContainer"), allLabels);
            const editNbSchedConfig = document.getElementById("editNbSchedConfig");
            const editNbSchedVcpu = document.getElementById("editNbSchedVcpu");
            const editNbSchedMemory = document.getElementById("editNbSchedMemory");
            const editNbCron = document.getElementById("editNbCron");
            const editNbUnschedule = document.getElementById("editNbUnschedule");

            await loadConfigurationOptions(editNbSchedConfig, null, "notebook");
            wireConfigSelects(editNbSchedConfig, editNbSchedVcpu, editNbSchedMemory);

            let editNbId = null;
            let editNbHadSchedule = false;

            const editNbTimezone = document.getElementById("editNbTimezone");

            content.addEventListener("click", (e) => {
                if (!e.target.classList.contains("btn-edit-nb")) return;
                editNbId = e.target.dataset.id;
                const labels = JSON.parse(e.target.dataset.labels || "[]");
                const cron = e.target.dataset.cron || "";
                const existingTz = e.target.dataset.tz || "";
                populateTimezoneSelect(editNbTimezone, existingTz);
                editNbLabelsInput.setLabels(labels);
                editNbCron.value = cron;
                editNbHadSchedule = !!cron;
                editNbUnschedule.style.display = cron ? "inline-block" : "none";
                // Reset schedule config to defaults
                editNbSchedConfig.selectedIndex = 0;
                const sCfg = getSelectedConfig(editNbSchedConfig);
                populateVcpuSelect(editNbSchedVcpu, editNbSchedMemory, sCfg.vcpu, sCfg.memory);
                const nb = notebookMap[decodeURIComponent(editNbId)];
                if (nb) applyNotebookDefaults(nb, editNbSchedConfig, editNbSchedVcpu, editNbSchedMemory);
                editNbDialog.showModal();
            });

            document.getElementById("editNbCancel").addEventListener("click", () => editNbDialog.close());

            editNbUnschedule.addEventListener("click", async () => {
                editNbUnschedule.disabled = true;
                editNbUnschedule.textContent = "Removing...";
                const res = await fetch(CONFIG.apiBaseUrl + "/api/notebooks/" + encodeURIComponent(editNbId), {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ unschedule: true }),
                });
                if (res.ok) {
                    editNbDialog.close();
                    window.location.reload();
                } else {
                    const err = await res.json().catch(() => ({}));
                    alert("Unschedule failed: " + (err.error || res.status));
                    editNbUnschedule.disabled = false;
                    editNbUnschedule.textContent = "Remove schedule";
                }
            });

            document.getElementById("editNbSubmit").addEventListener("click", async () => {
                const btn = document.getElementById("editNbSubmit");
                btn.disabled = true;
                btn.textContent = "Saving...";
                const patchBody = { labels: editNbLabelsInput.getLabels() };
                const cronVal = editNbCron.value.trim();
                if (cronVal) {
                    const sCfg = getSelectedConfig(editNbSchedConfig);
                    patchBody.schedule_cron = cronVal;
                    patchBody.schedule_timezone = editNbTimezone.value;
                    patchBody.schedule_iam_role_arn = sCfg.iam_role_arn;
                    patchBody.schedule_ecr_image_uri = sCfg.ecr_image_uri;
                    patchBody.schedule_vcpu = parseInt(editNbSchedVcpu.value);
                    patchBody.schedule_memory = parseInt(editNbSchedMemory.value);
                } else if (editNbHadSchedule) {
                    patchBody.unschedule = true;
                }
                const res = await fetch(CONFIG.apiBaseUrl + "/api/notebooks/" + encodeURIComponent(editNbId), {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(patchBody),
                });
                if (res.ok) {
                    editNbDialog.close();
                    window.location.reload();
                } else {
                    const err = await res.json().catch(() => ({}));
                    alert("Update failed: " + (err.error || res.status));
                    btn.disabled = false;
                    btn.textContent = "Save";
                }
            });
        })();
    </script>
</body>
</html>
