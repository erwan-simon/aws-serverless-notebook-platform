<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurations</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .btn-back { display: inline-block; padding: 5px 14px; border-radius: 4px; text-decoration: none; font-size: 13px; background: #eee; color: #333; }
        .btn-add { display: inline-block; padding: 7px 18px; background: #fff; color: #444; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 14px; transition: all 0.15s; }
        .btn-add:hover { background: #f5f5f5; border-color: #999; color: #222; }
        .btn-delete { background: #ffebee; color: #c62828; cursor: pointer; border: none; font-size: 13px; padding: 5px 14px; border-radius: 4px; }
        .btn-delete:hover { background: #ffcdd2; }
        .ext-link { color: #7b1fa2; text-decoration: none; font-weight: 500; }
        .ext-link:hover { text-decoration: underline; }
        .header-bar { display: flex; align-items: center; justify-content: space-between; }
        .cfg-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .cfg-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px 20px; background: #fafafa; }
        .cfg-card:hover { border-color: #ccc; }
        .cfg-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .cfg-name { font-size: 16px; font-weight: 600; }
        .cfg-desc { font-size: 13px; color: #888; margin-top: 2px; }
        .cfg-details { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-top: 10px; font-size: 13px; }
        .cfg-detail { display: flex; align-items: center; gap: 5px; }
        .cfg-detail-label { color: #999; font-weight: 500; }
        .cfg-detail-value { color: #555; font-family: monospace; font-size: 12px; }
        .cfg-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>
    <div style="margin-bottom: 16px;"><a class="btn-back" href="index.html">Home</a></div>
    <div class="header-bar">
        <h1>Configurations</h1>
        <button class="btn-add" id="addBtn">+ Add Configuration</button>
    </div>
    <div class="filters-bar" id="cfgFilters" style="margin-bottom: 10px;"></div>
    <div id="content"><p class="loading">Loading configurations...</p></div>

    <dialog id="addDialog">
        <h3>Add Configuration</h3>
        <label for="inputName">Name</label>
        <input type="text" id="inputName" placeholder="My custom config">
        <label for="inputImage">Docker Image URI</label>
        <input type="text" id="inputImage" placeholder="123456.dkr.ecr.eu-west-1.amazonaws.com/repo:tag">
        <label for="inputRole">IAM Role ARN</label>
        <input type="text" id="inputRole" placeholder="arn:aws:iam::123456789:role/MyRole">
        <label for="inputVcpu">vCPU</label>
        <select id="inputVcpu"></select>
        <label for="inputMemory">Memory</label>
        <select id="inputMemory"></select>
        <label for="inputDesc">Description <span style="font-weight:400; color:#999;">(optional)</span></label>
        <input type="text" id="inputDesc" placeholder="">
        <label>Labels <span style="font-weight:400; color:#999;">(optional)</span></label>
        <div id="addLabelsContainer"></div>
        <div>
            <button class="btn-submit" id="submitBtn">Add</button>
            <button class="btn-cancel" id="cancelBtn">Cancel</button>
        </div>
    </dialog>

    <dialog id="editDialog">
        <h3>Edit Configuration</h3>
        <input type="hidden" id="editId">
        <label for="editName">Name</label>
        <input type="text" id="editName">
        <label for="editImage">Docker Image URI</label>
        <input type="text" id="editImage">
        <label for="editRole">IAM Role ARN</label>
        <input type="text" id="editRole">
        <label for="editVcpu">vCPU</label>
        <select id="editVcpu"></select>
        <label for="editMemory">Memory</label>
        <select id="editMemory"></select>
        <label for="editDesc">Description <span style="font-weight:400; color:#999;">(optional)</span></label>
        <input type="text" id="editDesc">
        <label>Labels <span style="font-weight:400; color:#999;">(optional)</span></label>
        <div id="editLabelsContainer"></div>
        <div>
            <button class="btn-submit" id="editSubmitBtn">Save</button>
            <button class="btn-cancel" id="editCancelBtn">Cancel</button>
        </div>
    </dialog>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        (async function () {
            await window._authReady;

            const content = document.getElementById("content");
            const dialog = document.getElementById("addDialog");

            const allLabels = await loadAllLabels();
            const addLabelsInput = createLabelsInput(document.getElementById("addLabelsContainer"), allLabels);
            const editLabelsInput = createLabelsInput(document.getElementById("editLabelsContainer"), allLabels);

            const inputVcpu = document.getElementById("inputVcpu");
            const inputMemory = document.getElementById("inputMemory");
            populateVcpuSelect(inputVcpu, inputMemory);
            inputVcpu.addEventListener("change", () => populateMemorySelect(inputVcpu, inputMemory));

            function ecrConsoleUrl(uri) {
                const match = uri.match(/^(\d+)\.dkr\.ecr\.([^.]+)\.amazonaws\.com\/(.+?)(?::.*)?$/);
                if (!match) return null;
                const [, accountId, region, repo] = match;
                return "https://" + region + ".console.aws.amazon.com/ecr/repositories/private/" + accountId + "/" + repo;
            }

            function iamConsoleUrl(arn) {
                const match = arn.match(/^arn:aws:iam::\d+:role\/(.+)$/);
                if (!match) return null;
                return "https://us-east-1.console.aws.amazon.com/iam/home#/roles/details/" + encodeURIComponent(match[1]);
            }

            function validationBadge(label, execId, status) {
                if (!execId) return "";
                if (status === "SUCCEEDED") return '<span class="status-badge status-validated">' + label + ': Compatible</span>';
                if (status === "FAILED" || status === "STOPPED") return '<span class="status-badge status-failed" data-exec-id="' + execId + '" data-label="' + label + '">' + label + ': Incompatible</span>';
                return '<span class="status-badge status-validating" data-exec-id="' + execId + '" data-label="' + label + '">' + label + ': Validating</span>';
            }

            function ecsTaskConsoleUrl(taskArn) {
                const match = taskArn.match(/^arn:aws:ecs:([^:]+):[^:]+:task\/([^/]+)\/(.+)$/);
                if (!match) return null;
                const [, region, cluster, taskId] = match;
                return "https://" + region + ".console.aws.amazon.com/ecs/v2/clusters/" + cluster + "/tasks/" + taskId + "/configuration";
            }

            async function checkValidations() {
                const badges = document.querySelectorAll("[data-exec-id]");
                await Promise.all(Array.from(badges).map(async (badge) => {
                    const execId = badge.dataset.execId;
                    const label = badge.dataset.label || "";
                    try {
                        const res = await fetch(CONFIG.apiBaseUrl + "/api/executions/" + encodeURIComponent(execId) + "/status");
                        if (!res.ok) return;
                        const data = await res.json();
                        if (data.status === "SUCCEEDED") {
                            badge.textContent = label + ": Compatible";
                            badge.className = "status-badge status-validated";
                            badge.removeAttribute("data-exec-id");
                        } else if (data.status === "FAILED" || data.status === "STOPPED") {
                            const taskUrl = ecsTaskConsoleUrl(data.task_arn || "");
                            if (taskUrl) {
                                const link = document.createElement("a");
                                link.href = taskUrl;
                                link.target = "_blank";
                                link.innerHTML = label + ": Incompatible &#8599;";
                                link.className = "status-badge status-failed";
                                link.style.textDecoration = "none";
                                link.title = data.failure_reason || "Validation failed";
                                badge.replaceWith(link);
                            } else {
                                badge.textContent = label + ": Incompatible";
                                badge.className = "status-badge status-failed";
                                badge.removeAttribute("data-exec-id");
                            }
                        }
                    } catch (e) { /* ignore */ }
                }));
            }

            function linkOrText(url, label) {
                return url
                    ? '<a class="ext-link" href="' + url + '" target="_blank">' + label + ' &#8599;</a>'
                    : '<span>' + label + '</span>';
            }

            function renderCard(cfg) {
                    const isManaged = cfg.managed_by === "terraform";
                    const imageLabel = (cfg.ecr_image_uri || "").split("/").pop();
                    const roleLabel = (cfg.iam_role_arn || "").split("/").pop();
                    const ecrUrl = ecrConsoleUrl(cfg.ecr_image_uri || "");
                    const iamUrl = iamConsoleUrl(cfg.iam_role_arn || "");

                    let html = '<div class="cfg-card">';
                    html += '<div class="cfg-header">';
                    html += '<div><span class="cfg-name">' + (cfg.name || "") + '</span>';
                    if (cfg.description) html += '<div class="cfg-desc">' + cfg.description + '</div>';
                    html += '</div>';
                    html += '<div style="display:flex;align-items:center;gap:8px;">';
                    html += validationBadge("Notebook", cfg.validation_notebook_execution_id, cfg.validation_notebook_status);
                    html += validationBadge("Session", cfg.validation_session_execution_id, cfg.validation_session_status);
                    if (isManaged) {
                        html += '<span style="font-size:12px;color:#999;font-style:italic;">Terraform</span>';
                    }
                    html += '<div class="menu-wrap">';
                    html += '<button class="menu-toggle">&#8942;</button>';
                    html += '<div class="menu-dropdown">';
                    html += '<button data-action="run-session" data-cfg=\'' + JSON.stringify(cfg).replace(/'/g, "&#39;") + '\'>Run Session</button>';
                    if (!isManaged) {
                        html += '<button data-action="edit" data-cfg=\'' + JSON.stringify(cfg).replace(/'/g, "&#39;") + '\'>Edit</button>';
                        html += '<button data-action="validate" data-id="' + cfg.id + '">Revalidate</button>';
                        html += '<button class="danger" data-action="delete" data-id="' + cfg.id + '">Delete</button>';
                    }
                    html += '</div></div>';
                    html += '</div>';
                    html += '</div>';
                    if (cfg.labels && cfg.labels.length) {
                        html += '<div style="margin-top:6px;">';
                        for (const label of cfg.labels) html += '<span class="label-tag" title="' + label + '">' + label + '</span>';
                        html += '</div>';
                    }
                    html += '<div class="cfg-details">';
                    html += '<div class="cfg-detail"><span class="cfg-detail-label">Image</span> <span class="cfg-detail-value">' + linkOrText(ecrUrl, imageLabel) + '</span></div>';
                    html += '<div class="cfg-detail"><span class="cfg-detail-label">Role</span> <span class="cfg-detail-value">' + linkOrText(iamUrl, roleLabel) + '</span></div>';
                    html += '<div class="cfg-detail"><span class="cfg-detail-label">vCPU</span> <span class="cfg-detail-value">' + vcpuLabel(cfg.vcpu) + '</span></div>';
                    html += '<div class="cfg-detail"><span class="cfg-detail-label">Memory</span> <span class="cfg-detail-value">' + memLabel(cfg.memory) + '</span></div>';
                    html += '</div>';
                    if (cfg.created_by) {
                        html += '<div class="cfg-footer">' + cfg.created_by + '</div>';
                    }
                    html += '</div>';
                    return html;
            }

            let allConfigs = [];

            async function loadConfigurations() {
                try {
                    const res = await fetch(CONFIG.apiBaseUrl + "/api/configurations");
                    if (res.ok) allConfigs = await res.json();
                } catch (e) { /* ignore */ }
                // Build label filter
                const cfgLabels = [...new Set(allConfigs.flatMap(c => c.labels || []))].sort();
                const filtersEl = document.getElementById("cfgFilters");
                filtersEl.innerHTML = '<select id="filterCfgLabel"><option value="">All labels</option>' +
                    cfgLabels.map(l => '<option value="' + l + '">' + l + '</option>').join("") + '</select>';
                document.getElementById("filterCfgLabel").addEventListener("change", renderFilteredConfigs);
                renderFilteredConfigs();
            }

            function renderFilteredConfigs() {
                const labelVal = document.getElementById("filterCfgLabel").value;
                const filtered = labelVal ? allConfigs.filter(c => (c.labels || []).includes(labelVal)) : allConfigs;
                let html = '<div class="cfg-list">';
                for (const cfg of filtered) html += renderCard(cfg);
                html += '</div>';
                content.innerHTML = html;
                checkValidations();
            }

            await loadConfigurations();

            document.getElementById("addBtn").addEventListener("click", () => {
                document.getElementById("inputName").value = "";
                document.getElementById("inputImage").value = "";
                document.getElementById("inputRole").value = "";
                document.getElementById("inputDesc").value = "";
                addLabelsInput.setLabels([]);
                populateVcpuSelect(inputVcpu, inputMemory);
                dialog.showModal();
            });

            document.getElementById("cancelBtn").addEventListener("click", () => dialog.close());

            document.getElementById("submitBtn").addEventListener("click", async () => {
                const name = document.getElementById("inputName").value.trim();
                const image = document.getElementById("inputImage").value.trim();
                const role = document.getElementById("inputRole").value.trim();
                const desc = document.getElementById("inputDesc").value.trim();
                if (!name || !image || !role) { alert("Name, Image URI and Role ARN are required"); return; }
                const btn = document.getElementById("submitBtn");
                btn.disabled = true;
                btn.textContent = "Adding...";
                const body = { name, ecr_image_uri: image, iam_role_arn: role, vcpu: parseInt(inputVcpu.value), memory: parseInt(inputMemory.value) };
                if (desc) body.description = desc;
                const aLabels = addLabelsInput.getLabels();
                if (aLabels.length) body.labels = aLabels;
                const res = await fetch(CONFIG.apiBaseUrl + "/api/configurations", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                });
                if (res.ok) {
                    dialog.close();
                    await loadConfigurations();
                } else {
                    const err = await res.json().catch(() => ({}));
                    alert("Failed: " + (err.error || res.status));
                }
                btn.disabled = false;
                btn.textContent = "Add";
            });

            // Menu toggle
            initMenuToggle(content);

            // Menu actions
            content.addEventListener("click", async (e) => {
                const btn = e.target.closest("[data-action]");
                if (!btn) return;
                const action = btn.dataset.action;
                const id = btn.dataset.id;

                if (action === "delete") {
                    if (!confirm("Delete this configuration?")) return;
                    const res = await fetch(CONFIG.apiBaseUrl + "/api/configurations/" + encodeURIComponent(id), { method: "DELETE" });
                    if (res.ok) { await loadConfigurations(); } else { const err = await res.json().catch(() => ({})); alert("Delete failed: " + (err.error || res.status)); }
                }

                if (action === "validate") {
                    const res = await fetch(CONFIG.apiBaseUrl + "/api/configurations/" + encodeURIComponent(id), { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ force_revalidation: true }) });
                    if (res.ok) { await loadConfigurations(); } else { const err = await res.json().catch(() => ({})); alert("Revalidate failed: " + (err.error || res.status)); }
                }

                if (action === "run-session") {
                    const cfg = JSON.parse(btn.dataset.cfg);
                    btn.textContent = "Launching...";
                    const res = await fetch(CONFIG.apiBaseUrl + "/api/sessions", {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ ecr_image_uri: cfg.ecr_image_uri, iam_role_arn: cfg.iam_role_arn, vcpu: parseInt(cfg.vcpu), memory: parseInt(cfg.memory) }),
                    });
                    if (res.ok) { window.location.href = "session.html"; } else { const err = await res.json().catch(() => ({})); alert("Launch failed: " + (err.error || res.status)); btn.textContent = "Run Session"; }
                }

                if (action === "edit") {
                    const cfg = JSON.parse(btn.dataset.cfg);
                    document.getElementById("editId").value = cfg.id;
                    document.getElementById("editName").value = cfg.name || "";
                    document.getElementById("editImage").value = cfg.ecr_image_uri || "";
                    document.getElementById("editRole").value = cfg.iam_role_arn || "";
                    document.getElementById("editDesc").value = cfg.description || "";
                    editLabelsInput.setLabels(cfg.labels || []);
                    populateVcpuSelect(editVcpu, editMemory, parseInt(cfg.vcpu), parseInt(cfg.memory));
                    editDialog.showModal();
                }
            });

            // Edit dialog
            const editDialog = document.getElementById("editDialog");
            const editVcpu = document.getElementById("editVcpu");
            const editMemory = document.getElementById("editMemory");
            editVcpu.addEventListener("change", () => populateMemorySelect(editVcpu, editMemory));
            document.getElementById("editCancelBtn").addEventListener("click", () => editDialog.close());
            document.getElementById("editSubmitBtn").addEventListener("click", async () => {
                const id = document.getElementById("editId").value;
                const body = {
                    name: document.getElementById("editName").value.trim(),
                    ecr_image_uri: document.getElementById("editImage").value.trim(),
                    iam_role_arn: document.getElementById("editRole").value.trim(),
                    description: document.getElementById("editDesc").value.trim(),
                    vcpu: parseInt(editVcpu.value),
                    memory: parseInt(editMemory.value),
                    labels: editLabelsInput.getLabels(),
                };
                if (!body.name || !body.ecr_image_uri || !body.iam_role_arn) { alert("Name, Image URI and Role ARN are required"); return; }
                const btn = document.getElementById("editSubmitBtn");
                btn.disabled = true; btn.textContent = "Saving...";
                const res = await fetch(CONFIG.apiBaseUrl + "/api/configurations/" + encodeURIComponent(id), {
                    method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
                });
                if (res.ok) { editDialog.close(); await loadConfigurations(); } else { const err = await res.json().catch(() => ({})); alert("Update failed: " + (err.error || res.status)); }
                btn.disabled = false; btn.textContent = "Save";
            });
        })();
    </script>
</body>
</html>
