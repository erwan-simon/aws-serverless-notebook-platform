<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executions</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        a.btn { display: inline-block; padding: 5px 14px; border-radius: 4px; text-decoration: none; font-size: 13px; }
        .btn-view { background: #e3f2fd; color: #1565c0; }
        .btn-back { background: #eee; color: #333; }
    </style>
</head>
<body>
    <h1 id="title">Executions</h1>
    <p><a class="btn btn-back" href="index.html">Back to notebooks</a></p>
    <div id="content"><p class="loading">Loading executions...</p></div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        (async function () {
            await window._authReady;

            const params = new URLSearchParams(window.location.search);
            const notebookId = params.get("notebook_id");

            const res = await fetch(CONFIG.apiBaseUrl + "/api/notebooks/" + encodeURIComponent(notebookId) + "/executions");
            const content = document.getElementById("content");

            if (!res.ok) {
                const err = await res.text();
                content.innerHTML = "<p style='color:red'>Error " + res.status + ": " + err + "</p>";
                return;
            }

            const executions = await res.json();

            if (!Array.isArray(executions) || executions.length === 0) {
                content.innerHTML = "<p>No executions found.</p>";
                return;
            }

            const owners = [...new Set(executions.map(ex => ex.owner_email || "").filter(Boolean))].sort();
            const statuses = [...new Set(executions.map(ex => ex.status || "").filter(Boolean))].sort();
            const triggers = [...new Set(executions.map(ex => ex.trigger_type || "manual"))].sort();

            let filtersHtml = '<div class="filters-bar">';
            filtersHtml += '<select id="filterOwner"><option value="">All owners</option>';
            for (const o of owners) filtersHtml += '<option value="' + o + '">' + o + '</option>';
            filtersHtml += '</select>';
            filtersHtml += '<select id="filterStatus"><option value="">All statuses</option>';
            for (const s of statuses) filtersHtml += '<option value="' + s + '">' + s + '</option>';
            filtersHtml += '</select>';
            filtersHtml += '<select id="filterTrigger"><option value="">All triggers</option>';
            for (const t of triggers) filtersHtml += '<option value="' + t + '">' + t + '</option>';
            filtersHtml += '</select>';
            filtersHtml += '</div>';

            function renderTable(filtered) {
                let html = "<table><thead><tr><th>Status</th><th>Trigger</th><th>Owner</th><th>Started</th><th>Duration</th><th>Actions</th></tr></thead><tbody>";
                for (const ex of filtered) {
                    const statusLower = ex.status.toLowerCase();
                    const started = ex.started_at ? new Date(ex.started_at).toLocaleString() : "";
                    const duration = (ex.started_at && !ex.finished_at && (ex.status === "RUNNING" || ex.status === "PENDING"))
                        ? "running..."
                        : (ex.started_at ? durationStr(ex.started_at, ex.finished_at) : "");
                    html += "<tr>";
                    html += '<td><span class="status-badge status-' + statusLower + '">' + ex.status + '</span></td>';
                    html += "<td>" + (ex.trigger_type || "manual") + "</td>";
                    html += "<td>" + (ex.owner_email || "") + "</td>";
                    html += "<td>" + started + "</td>";
                    html += "<td>" + duration + "</td>";
                    html += "<td>";
                    if (ex.status === "SUCCEEDED" && ex.output_s3_key) {
                        html += '<a class="btn btn-view" href="notebook.html?execution_id=' + encodeURIComponent(ex.id) + '">View Output</a>';
                    } else if (ex.status === "PENDING" || ex.status === "RUNNING") {
                        html += '<a class="btn btn-view" href="execution_status.html?execution_id=' + encodeURIComponent(ex.id) + '">Track</a>';
                    }
                    html += "</td>";
                    html += "</tr>";
                }
                html += "</tbody></table>";
                return html;
            }

            function applyFilters() {
                const ownerVal = document.getElementById("filterOwner").value;
                const statusVal = document.getElementById("filterStatus").value;
                const triggerVal = document.getElementById("filterTrigger").value;
                const filtered = executions.filter(ex => {
                    if (ownerVal && (ex.owner_email || "") !== ownerVal) return false;
                    if (statusVal && (ex.status || "") !== statusVal) return false;
                    if (triggerVal && (ex.trigger_type || "manual") !== triggerVal) return false;
                    return true;
                });
                document.getElementById("execTable").innerHTML = renderTable(filtered);
            }

            content.innerHTML = filtersHtml + '<div id="execTable">' + renderTable(executions) + '</div>';

            document.getElementById("filterOwner").addEventListener("change", applyFilters);
            document.getElementById("filterStatus").addEventListener("change", applyFilters);
            document.getElementById("filterTrigger").addEventListener("change", applyFilters);
        })();
    </script>
</body>
</html>
