<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Status</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { max-width: 500px; margin: 80px auto; padding: 0 20px; text-align: center; }
        .spinner { border-top-color: #2e7d32; }
        .status { font-size: 18px; margin: 20px 0; }
        a.btn { display: inline-block; padding: 10px 24px; border-radius: 4px; text-decoration: none; font-size: 15px; margin: 8px; }
        .btn-open { background: #2e7d32; color: #fff; }
        .btn-stop { background: #c62828; color: #fff; }
        .btn-back { background: #eee; color: #333; }
        .error-box { background: #fdecea; border: 1px solid #f5c6cb; border-radius: 6px; padding: 16px; margin: 20px 0; color: #721c24; text-align: left; }
    </style>
</head>
<body>
    <h1>Session</h1>
    <div id="starting">
        <div class="spinner"></div>
        <p class="status" id="status-msg">Starting Jupyter session...</p>
    </div>
    <div id="running" class="hidden">
        <p class="status">Jupyter is ready!</p>
        <p id="redirect-msg"></p>
        <a class="btn btn-open" id="openBtn" href="#" target="_blank">Open Jupyter</a>
    </div>
    <div id="error" class="hidden">
        <div class="error-box">
            <strong id="error-title">Error</strong>
            <p id="error-msg"></p>
        </div>
    </div>
    <div style="margin-top: 30px;">
        <a class="btn btn-stop" id="stopBtn" href="#">Stop Session</a>
        <a class="btn btn-back" href="index.html">Back to notebooks</a>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        (async function () {
            await window._authReady;

            let polling = null;

            async function checkStatus() {
                const res = await fetch(CONFIG.apiBaseUrl + "/api/sessions/me");
                const data = await res.json();

                if (data.status === "running") {
                    clearInterval(polling);
                    document.getElementById("starting").classList.add("hidden");
                    document.getElementById("running").classList.remove("hidden");
                    document.getElementById("openBtn").href = data.url;
                    document.getElementById("redirect-msg").textContent = "Redirecting in 3 seconds...";
                    setTimeout(() => { window.open(data.url, "_blank"); }, 3000);
                } else if (data.status === "error") {
                    clearInterval(polling);
                    document.getElementById("starting").classList.add("hidden");
                    document.getElementById("error").classList.remove("hidden");
                    document.getElementById("error-title").textContent = "Session failed";
                    document.getElementById("error-msg").textContent = data.message || "Unknown error";
                } else if (data.message) {
                    document.getElementById("status-msg").textContent = data.message;
                }
            }

            polling = setInterval(checkStatus, 5000);
            checkStatus();

            document.getElementById("stopBtn").addEventListener("click", async (e) => {
                e.preventDefault();
                clearInterval(polling);
                await fetch(CONFIG.apiBaseUrl + "/api/sessions/" + encodeURIComponent(serviceName), { method: "DELETE" });
                window.location.href = "index.html";
            });
        })();
    </script>
</body>
</html>
