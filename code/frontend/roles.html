<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAM Roles</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #333; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; }
        th { background: #f7f7f7; font-weight: 600; }
        tr:hover { background: #f9f9f9; }
        .arn-cell { font-family: monospace; font-size: 12px; color: #555; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .desc-cell { font-size: 13px; color: #666; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn-back { display: inline-block; padding: 5px 14px; border-radius: 4px; text-decoration: none; font-size: 13px; background: #eee; color: #333; }
        .btn-add { display: inline-block; padding: 7px 18px; background: #fff; color: #444; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 14px; transition: all 0.15s; }
        .btn-add:hover { background: #f5f5f5; border-color: #999; color: #222; }
        .btn-delete { background: #ffebee; color: #c62828; cursor: pointer; border: none; font-size: 13px; padding: 5px 14px; border-radius: 4px; }
        .btn-delete:hover { background: #ffcdd2; }
        .loading { color: #999; font-style: italic; }
        .empty { color: #999; font-style: italic; padding: 20px 0; }
        dialog { border: 1px solid #ddd; border-radius: 8px; padding: 24px; max-width: 450px; }
        dialog::backdrop { background: rgba(0,0,0,0.3); }
        dialog label { display: block; margin-top: 14px; font-weight: 600; font-size: 14px; }
        dialog input[type="text"] { width: 100%; padding: 8px; margin-top: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        dialog button { margin-top: 18px; padding: 8px 20px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
        dialog .btn-submit { background: #7b1fa2; color: #fff; }
        dialog .btn-cancel { background: #eee; color: #333; margin-left: 8px; }
        .header-bar { display: flex; align-items: center; justify-content: space-between; }
    </style>
</head>
<body>
    <div style="margin-bottom: 16px;"><a class="btn-back" href="index.html">Home</a></div>
    <div class="header-bar">
        <h1>IAM Roles</h1>
        <button class="btn-add" id="addBtn">+ Add Role</button>
    </div>
    <div id="content"><p class="loading">Loading roles...</p></div>

    <dialog id="addDialog">
        <h3>Add IAM Role</h3>
        <label for="inputName">Name</label>
        <input type="text" id="inputName" placeholder="My custom role">
        <label for="inputArn">IAM Role ARN</label>
        <input type="text" id="inputArn" placeholder="arn:aws:iam::123456789:role/MyRole">
        <label for="inputDesc">Description <span style="font-weight:400; color:#999;">(optional)</span></label>
        <input type="text" id="inputDesc" placeholder="">
        <div>
            <button class="btn-submit" id="submitBtn">Add</button>
            <button class="btn-cancel" id="cancelBtn">Cancel</button>
        </div>
    </dialog>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        (async function () {
            await window._authReady;

            const content = document.getElementById("content");
            const dialog = document.getElementById("addDialog");

            async function loadRoles() {
                const res = await fetch(CONFIG.apiBaseUrl + "/api/roles");
                if (!res.ok) {
                    content.innerHTML = "<p style='color:red'>Error " + res.status + "</p>";
                    return;
                }
                const roles = await res.json();
                if (!roles.length) {
                    content.innerHTML = '<p class="empty">No custom roles added yet.</p>';
                    return;
                }
                let html = "<table><thead><tr><th>Name</th><th>Role ARN</th><th>Description</th><th>Added by</th><th>Date</th><th></th></tr></thead><tbody>";
                function iamConsoleUrl(arn) {
                    // ARN format: arn:aws:iam::123456789:role/MyRole or arn:aws:iam::123456789:role/path/MyRole
                    const match = arn.match(/^arn:aws:iam::\d+:role\/(.+)$/);
                    if (!match) return null;
                    return "https://us-east-1.console.aws.amazon.com/iam/home#/roles/details/" + encodeURIComponent(match[1]);
                }
                for (const role of roles) {
                    const date = role.created_at ? new Date(role.created_at).toLocaleDateString() : "";
                    const iamUrl = iamConsoleUrl(role.iam_role_arn || "");
                    const nameHtml = iamUrl
                        ? '<a href="' + iamUrl + '" target="_blank" style="color:#7b1fa2; text-decoration:none; font-weight:600;">' + (role.name || "") + ' &#8599;</a>'
                        : (role.name || "");
                    html += "<tr>";
                    html += "<td>" + nameHtml + "</td>";
                    html += '<td class="arn-cell" title="' + (role.iam_role_arn || "") + '">' + (role.iam_role_arn || "") + "</td>";
                    html += '<td class="desc-cell">' + (role.description || "") + "</td>";
                    html += "<td>" + (role.created_by || "") + "</td>";
                    html += "<td>" + date + "</td>";
                    html += '<td><button class="btn-delete" data-id="' + role.id + '">Delete</button></td>';
                    html += "</tr>";
                }
                html += "</tbody></table>";
                content.innerHTML = html;
            }

            await loadRoles();

            document.getElementById("addBtn").addEventListener("click", () => {
                document.getElementById("inputName").value = "";
                document.getElementById("inputArn").value = "";
                document.getElementById("inputDesc").value = "";
                dialog.showModal();
            });

            document.getElementById("cancelBtn").addEventListener("click", () => dialog.close());

            document.getElementById("submitBtn").addEventListener("click", async () => {
                const name = document.getElementById("inputName").value.trim();
                const arn = document.getElementById("inputArn").value.trim();
                const desc = document.getElementById("inputDesc").value.trim();
                if (!name || !arn) { alert("Name and Role ARN are required"); return; }
                const btn = document.getElementById("submitBtn");
                btn.disabled = true;
                btn.textContent = "Adding...";
                const body = { name, iam_role_arn: arn };
                if (desc) body.description = desc;
                const res = await fetch(CONFIG.apiBaseUrl + "/api/roles", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                });
                if (res.ok) {
                    dialog.close();
                    await loadRoles();
                } else {
                    const err = await res.json().catch(() => ({}));
                    alert("Failed: " + (err.error || res.status));
                }
                btn.disabled = false;
                btn.textContent = "Add";
            });

            content.addEventListener("click", async (e) => {
                if (!e.target.classList.contains("btn-delete")) return;
                if (!confirm("Delete this role?")) return;
                const id = e.target.dataset.id;
                e.target.disabled = true;
                e.target.textContent = "Deleting...";
                const res = await fetch(CONFIG.apiBaseUrl + "/api/roles/" + encodeURIComponent(id), { method: "DELETE" });
                if (res.ok) {
                    await loadRoles();
                } else {
                    const err = await res.json().catch(() => ({}));
                    alert("Delete failed: " + (err.error || res.status));
                    e.target.disabled = false;
                    e.target.textContent = "Delete";
                }
            });
        })();
    </script>
</body>
</html>
