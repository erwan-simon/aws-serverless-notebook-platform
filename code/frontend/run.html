<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Session</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; color: #333; }
        h1 { font-size: 22px; }
        label { display: block; margin-top: 18px; font-weight: 600; font-size: 14px; }
        select, input[type="number"] { width: 100%; padding: 8px; margin-top: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        .info { background: #f7f7f7; padding: 10px 14px; border-radius: 4px; margin-bottom: 10px; font-size: 14px; word-break: break-all; }
        button { margin-top: 24px; padding: 10px 28px; background: #2e7d32; color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
        button:hover { background: #1b5e20; }
        button:disabled { background: #999; cursor: not-allowed; }
        a { color: #1565c0; }
    </style>
</head>
<body>
    <h1>Launch Jupyter Session</h1>

    <label for="role">IAM Role</label>
    <select id="role"></select>

    <label for="image">Docker Image</label>
    <select id="image"></select>

    <label for="vcpu">vCPU</label>
    <select id="vcpu"></select>

    <label for="memory">Memory</label>
    <select id="memory"></select>

    <button id="launchBtn">Launch</button>
    <p><a href="index.html">Back to notebooks</a></p>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        (async function () {
            await window._authReady;

            const roleSelect = document.getElementById("role");
            const imageSelect = document.getElementById("image");
            await Promise.all([
                loadRoleOptions(roleSelect),
                loadImageOptions(imageSelect),
            ]);

            // Fargate valid vCPU values (in CPU units)
            const VCPU_OPTIONS = [256, 512, 1024, 2048, 4096];
            const MEMORY_BY_VCPU = {
                256: [512, 1024, 2048],
                512: [1024, 2048, 3072, 4096],
                1024: [2048, 3072, 4096, 5120, 6144, 7168, 8192],
                2048: [4096, 5120, 6144, 7168, 8192, 9216, 10240, 11264, 12288, 13312, 14336, 15360, 16384],
                4096: [8192, 9216, 10240, 11264, 12288, 13312, 14336, 15360, 16384, 17408, 18432, 19456, 20480, 21504, 22528, 23552, 24576, 25600, 26624, 27648, 28672, 29696, 30720],
            };
            function vcpuLabel(v) { return v < 1024 ? (v / 1024).toFixed(2).replace(/0$/, "") + " vCPU" : (v / 1024) + " vCPU"; }
            function memLabel(m) { return m >= 1024 ? (m / 1024) + " GB" : m + " MB"; }

            const vcpuSelect = document.getElementById("vcpu");
            const memorySelect = document.getElementById("memory");

            function populateVcpu() {
                vcpuSelect.innerHTML = "";
                for (const v of VCPU_OPTIONS) {
                    if (v > CONFIG.taskMaxVcpu) break;
                    const opt = document.createElement("option");
                    opt.value = v;
                    opt.textContent = vcpuLabel(v);
                    if (v === CONFIG.taskDefaultVcpu) opt.selected = true;
                    vcpuSelect.appendChild(opt);
                }
                populateMemory();
            }
            function populateMemory() {
                const curVcpu = parseInt(vcpuSelect.value);
                const allowed = (MEMORY_BY_VCPU[curVcpu] || []).filter(m => m <= CONFIG.taskMaxMemory);
                memorySelect.innerHTML = "";
                for (const m of allowed) {
                    const opt = document.createElement("option");
                    opt.value = m;
                    opt.textContent = memLabel(m);
                    if (m === CONFIG.taskDefaultMemory) opt.selected = true;
                    memorySelect.appendChild(opt);
                }
            }
            populateVcpu();
            vcpuSelect.addEventListener("change", populateMemory);

            document.getElementById("launchBtn").addEventListener("click", async () => {
                const btn = document.getElementById("launchBtn");
                btn.disabled = true;
                btn.textContent = "Launching...";

                const res = await fetch(CONFIG.apiBaseUrl + "/api/sessions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        iam_role_arn: roleSelect.value,
                        ecr_image_uri: imageSelect.value,
                        vcpu: parseInt(vcpuSelect.value),
                        memory: parseInt(memorySelect.value),
                    }),
                });
                const data = await res.json();
                window.location.href = "status.html?service_name=" + encodeURIComponent(data.service_name) + "&jupyter_token=" + encodeURIComponent(data.jupyter_token);
            });
        })();
    </script>
</body>
</html>
