<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Session</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; color: #333; }
        h1 { font-size: 22px; }
        label { display: block; margin-top: 18px; font-weight: 600; font-size: 14px; }
        select, input[type="number"] { width: 100%; padding: 8px; margin-top: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        .info { background: #f7f7f7; padding: 10px 14px; border-radius: 4px; margin-bottom: 10px; font-size: 14px; word-break: break-all; }
        button { margin-top: 24px; padding: 10px 28px; background: #2e7d32; color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
        button:hover { background: #1b5e20; }
        button:disabled { background: #999; cursor: not-allowed; }
        a { color: #1565c0; }
    </style>
</head>
<body>
    <h1>Launch Jupyter Session</h1>

    <label for="config">Configuration</label>
    <select id="config"></select>

    <label for="vcpu">vCPU</label>
    <select id="vcpu"></select>

    <label for="memory">Memory</label>
    <select id="memory"></select>

    <button id="launchBtn">Launch</button>
    <p><a href="index.html">Back to notebooks</a></p>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        (async function () {
            await window._authReady;

            const configSelect = document.getElementById("config");
            await loadConfigurationOptions(configSelect);

            const vcpuSelect = document.getElementById("vcpu");
            const memorySelect = document.getElementById("memory");

            function applyConfigDefaults() {
                const cfg = getSelectedConfig(configSelect);
                populateVcpuSelect(vcpuSelect, memorySelect, cfg.vcpu, cfg.memory);
            }
            applyConfigDefaults();
            configSelect.addEventListener("change", applyConfigDefaults);
            vcpuSelect.addEventListener("change", () => populateMemorySelect(vcpuSelect, memorySelect));

            document.getElementById("launchBtn").addEventListener("click", async () => {
                const btn = document.getElementById("launchBtn");
                btn.disabled = true;
                btn.textContent = "Launching...";

                const res = await fetch(CONFIG.apiBaseUrl + "/api/sessions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        ...getSelectedConfig(configSelect),
                        vcpu: parseInt(vcpuSelect.value),
                        memory: parseInt(memorySelect.value),
                    }),
                });
                const data = await res.json();
                window.location.href = "session.html";
            });
        })();
    </script>
</body>
</html>
